name: "Docker"

on:
  workflow_dispatch:

  push:

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: dockette/litellm:latest-test
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test image
        run: make test DOCKER_TAG=latest-test

      - name: Smoke test image
        run: make test-docker DOCKER_TAG=latest-test

  version:
    name: "Version"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      litellm: ${{ steps.version.outputs.litellm }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read VERSION and LITELLM_VERSION
        id: version
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "litellm=$(sed -n 's/^ARG LITELLM_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

  build:
    name: "Build"
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        # latest, <VERSION>, <LITELLM_VERSION> and <LITELLM_VERSION>-<VERSION>
        tag:
          - "latest"
          - "${{ needs.version.outputs.version }}"
          - "${{ needs.version.outputs.litellm }}"
          - "${{ needs.version.outputs.litellm }}-${{ needs.version.outputs.version }}"
    uses: dockette/.github/.github/workflows/docker.yml@master
    secrets: inherit
    with:
      image: "dockette/litellm"
      tag: ${{ matrix.tag }}
      context: "."
      platforms: "linux/amd64,linux/arm64"
      push: ${{ github.ref == 'refs/heads/master' }}

  release:
    name: "Release"
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(cat VERSION)"
          u="$(sed -n 's/^ARG LITELLM_VERSION=//p' Dockerfile)"
          gh release view "$v" || gh release create "$v" --title "$v (LiteLLM $u)" --generate-notes

  docs:
    name: "Docs"
    needs: build
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/dockerhub-description.yml@master
    secrets: inherit
    with:
      image: "dockette/litellm"
